version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      dev-and-types:
        patterns: ['@types/*', 'eslint*', 'prettier', 'typescript', 'vitest', '@playwright/*']
      nest:
        patterns: ['@nestjs/*']
      mikro-orm:
        patterns: ['@mikro-orm/*']
      next:
        patterns: ['next', 'eslint-config-next', 'next-intl']
      opentelemetry:
        patterns: ['@opentelemetry/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
