# Services de données uniquement (Postgres, Meilisearch, MinIO, imgproxy) —
# pour un déploiement natif des apps Node (pm2 + nginx), sans les conteneuriser.
# Tous les ports sont liés à 127.0.0.1 : jamais exposés directement sur Internet,
# seules les apps pm2 (sur le même hôte) s'y connectent.
#
#   docker compose -f infra/docker/compose.data.yaml --env-file .env up -d
#
# Redis et Mailpit du compose de dev ne sont pas repris ici : Redis n'est pas
# utilisé par l'application, Mailpit est un faux SMTP réservé au développement
# (utiliser un vrai relais SMTP en production — voir .env.prod.pm2.example).

name: jokko-data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jokko}
      POSTGRES_USER: ${POSTGRES_USER:-jokko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      JOKKO_APP_PASSWORD: ${JOKKO_APP_PASSWORD:?JOKKO_APP_PASSWORD requis}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jokko} -d ${POSTGRES_DB:-jokko}']
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY requis}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - meili_data:/meili_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY requis}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY requis}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb -p local/${S3_BUCKET:-jokko-media};
      mc anonymous set download local/${S3_BUCKET:-jokko-media};
      echo 'bucket prêt';
      "
    restart: 'no'

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
      IMGPROXY_ENABLE_AVIF_DETECTION: 'true'
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - minio

volumes:
  postgres_data:
  meili_data:
  minio_data:
