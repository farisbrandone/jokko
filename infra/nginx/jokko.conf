# Configuration nginx — déploiement natif (pm2, sans Docker pour les apps Node).
#
# Remplacer VOTREDOMAINE.TLD partout (ex. via :
#   sed -i 's/VOTREDOMAINE\.TLD/jokko.shop/g' /etc/nginx/sites-available/jokko.conf
# ) puis :
#   ln -s /etc/nginx/sites-available/jokko.conf /etc/nginx/sites-enabled/jokko.conf
#   nginx -t && systemctl reload nginx
#
# Certificat : wildcard obtenu via DNS-01 (voir docs/deploiement-vps.md, §5) —
# un seul certificat couvre VOTREDOMAINE.TLD + *.VOTREDOMAINE.TLD, donc toutes
# les apps ci-dessous (api., dashboard., admin., media., img.) sont couvertes.
#
# Chaque bloc « upstream local » écoute uniquement sur 127.0.0.1 (pm2 / docker
# compose.data.yaml) : nginx est le seul point d'entrée public.

# ── Redirection HTTP → HTTPS pour tous les hôtes ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name VOTREDOMAINE.TLD *.VOTREDOMAINE.TLD;
    location / { return 301 https://$host$request_uri; }
}

# Bloc commun réutilisé par chaque vhost applicatif (via `include`).
# /etc/nginx/snippets/jokko-proxy.conf
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Forwarded-Host $host;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";

# ── Vitrine (apex + sous-domaines de boutiques) ──────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name VOTREDOMAINE.TLD *.VOTREDOMAINE.TLD;

    ssl_certificate     /etc/letsencrypt/live/VOTREDOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTREDOMAINE.TLD/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/jokko-proxy.conf;
    }
}

# ── API (BFF web + apps mobiles éventuelles) ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.VOTREDOMAINE.TLD;

    ssl_certificate     /etc/letsencrypt/live/VOTREDOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTREDOMAINE.TLD/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3333;
        include snippets/jokko-proxy.conf;
    }
}

# ── Back-office vendeur ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.VOTREDOMAINE.TLD;

    ssl_certificate     /etc/letsencrypt/live/VOTREDOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTREDOMAINE.TLD/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include snippets/jokko-proxy.conf;
    }
}

# ── Console plateforme ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.VOTREDOMAINE.TLD;

    ssl_certificate     /etc/letsencrypt/live/VOTREDOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTREDOMAINE.TLD/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        include snippets/jokko-proxy.conf;
    }
}

# ── Médias (lecture publique du bucket MinIO) ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.VOTREDOMAINE.TLD;

    ssl_certificate     /etc/letsencrypt/live/VOTREDOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTREDOMAINE.TLD/privkey.pem;

    client_max_body_size 0; # lecture seule côté public, les uploads passent par l'API

    location / {
        proxy_pass http://127.0.0.1:9000;
        include snippets/jokko-proxy.conf;
    }
}

# ── imgproxy (redimensionnement/optimisation des images) ─────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name img.VOTREDOMAINE.TLD;

    ssl_certificate     /etc/letsencrypt/live/VOTREDOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTREDOMAINE.TLD/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/jokko-proxy.conf;
    }
}
