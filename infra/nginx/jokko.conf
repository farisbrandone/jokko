# nginx — déploiement natif VPS (pm2, cohabite avec une autre app nginx).
#
# Ce fichier ne touche à AUCUNE config nginx existante : il ajoute simplement
# de nouveaux server_name (nginx multiplexe par nom d'hôte / SNI dans un même
# process, sans conflit avec les vhosts déjà en place pour une autre app).
#
# Domaine déjà renseigné : scoliaa.com. Installation : voir
# docs/deploiement-vps.md §6. En résumé —
#   cp jokko.conf /etc/nginx/sites-available/jokko.conf
#   ln -s /etc/nginx/sites-available/jokko.conf /etc/nginx/sites-enabled/jokko.conf
#   nginx -t && systemctl reload nginx
#
# TLS : un seul certificat wildcard (scoliaa.com + *.scoliaa.com),
# certificat d'origine Cloudflare statique (gratuit, 15 ans, pas de
# renouvellement) — voir docs/deploiement-vps.md §5. Il couvre TOUS les
# sous-domaines de boutiques, présents et futurs, sans reconfiguration :
# c'est le bloc "Vitrine" ci-dessous (server_name *.scoliaa.com) qui
# répond pour n'importe quel nom de boutique, généré dynamiquement par
# l'appli — rien à ajouter ici quand une nouvelle boutique est créée.

# ── Redirection HTTP → HTTPS pour tous les hôtes Jokko ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name scoliaa.com *.scoliaa.com;
    location / { return 301 https://$host$request_uri; }
}

# ── Vitrine (apex + sous-domaines de boutiques) ──────────────────────────
# Un seul bloc pour TOUTES les boutiques : le nom de la boutique (sous-domaine)
# est transmis tel quel à l'app via l'en-tête Host, qui résout le tenant.
# Le client qui navigue sur ma-boutique.scoliaa.com y reste : Next.js
# construit tous ses liens/appels internes à partir de ce même host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scoliaa.com *.scoliaa.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/jokko-proxy.conf;
    }
}

