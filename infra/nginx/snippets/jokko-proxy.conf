# À copier vers /etc/nginx/snippets/jokko-proxy.conf
# Inclus par chaque bloc « location / » de infra/nginx/jokko.conf.
# X-Forwarded-Host est indispensable : le storefront Next reconstruit
# l'origine publique (sous-domaine de boutique inclus) à partir de cet
# en-tête pour rester sur le même hôte après un paiement/une redirection.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_read_timeout 60s;
