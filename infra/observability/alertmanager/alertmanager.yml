route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: default
    # Brancher un canal réel (l'un ou l'autre) :
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
    #     channel: '#alertes-jokko'
    #     send_resolved: true
    # webhook_configs:
    #   - url: 'https://discord.com/api/webhooks/XXX/YYY/slack'
    #     send_resolved: true

inhibit_rules:
  - source_matchers: ['severity = critical']
    target_matchers: ['severity = warning']
    equal: ['alertname']
